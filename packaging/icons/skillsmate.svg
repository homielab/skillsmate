<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- App icon: the monochrome glyph (skillsmate-glyph.svg) in white on a
       near-black tile. Reads well on both light and dark docks/launchers. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2c"/>
      <stop offset="1" stop-color="#121213"/>
    </linearGradient>
    <mask id="spark">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M32 32.5 C32.9 38.4 34.6 40.1 40.5 41 C34.6 41.9 32.9 43.6 32 49.5 C31.1 43.6 29.4 41.9 23.5 41 C29.4 40.1 31.1 38.4 32 32.5 Z" fill="#000" transform="translate(32 42) scale(1.3) translate(-32 -41)"/>
    </mask>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#tile)"/>
  <!-- Hairline highlight so the tile edge stays visible on dark backgrounds. -->
  <rect x="16.75" y="16.75" width="222.5" height="222.5" rx="51.25" fill="none"
        stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
  <!-- Glyph: 64-unit design scaled to 140px, centred. -->
  <g transform="translate(58 58) scale(2.1875)" fill="#ffffff">
    <rect x="19" y="9" width="26" height="5" rx="2.5" fill-opacity="0.55"/>
    <rect x="12.5" y="17.5" width="39" height="5" rx="2.5" fill-opacity="0.78"/>
    <rect x="6" y="26" width="52" height="32" rx="8" mask="url(#spark)"/>
  </g>
</svg>
