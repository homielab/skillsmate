name: Release

# Push a tag like `v0.1.0` to build Linux and macOS packages and publish a GitHub release.
# The tag must match `version` in the workspace Cargo.toml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # Build on the oldest supported Ubuntu: binaries only run on systems with a
    # glibc at least as new as the build machine's.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libfuse2

      - name: Check tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          test "v$version" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo version $version" >&2; exit 1; }

      - name: Test
        run: cargo test --workspace --locked

      - name: Build .deb
        run: |
          cargo install cargo-deb --locked
          cargo deb -p skills-app --locked
          mkdir -p dist
          cp target/debian/*.deb dist/

      - name: Build AppImage
        run: packaging/linux/build-appimage.sh target/release/skillsmate

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked

      - name: Build universal app
        run: |
          cargo build --release --locked -p skills-app --target aarch64-apple-darwin
          cargo build --release --locked -p skills-app --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/skillsmate \
            target/aarch64-apple-darwin/release/skillsmate \
            target/x86_64-apple-darwin/release/skillsmate
          packaging/macos/build-app.sh target/release/skillsmate
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          ditto -c -k --keepParent dist/SkillsMate.app "dist/SkillsMate-${version}-macos-universal.zip"
          rm -r dist/SkillsMate.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: dist/*.zip

  publish:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
