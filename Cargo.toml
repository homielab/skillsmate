[workspace]
resolver = "2"
members = ["crates/skills-core", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/homielab/skillsmate"
homepage = "https://github.com/homielab/skillsmate"

[workspace.dependencies]
skills-core = { path = "crates/skills-core" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
indexmap = { version = "2", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
dirs = "6"
tempfile = "3"
sha2 = "0.11"
similar = "3"
pulldown-cmark = { version = "0.13", default-features = false }
tauri = "2"
tauri-build = "2"
tauri-plugin-opener = "2"

[workspace.lints.rust]
# `deny`, not `forbid`: the sandboxed Mac App Store build needs two Objective-C
# calls (src-tauri/src/home_access.rs). The core crate still forbids it
# outright (see its lib.rs).
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
