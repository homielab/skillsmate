[package]
name = "skills-app"
description = "SkillsMate: a fast, native desktop app for managing skills.sh skills"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "skillsmate"
path = "src/main.rs"

[dependencies]
skills-core.workspace = true
anyhow.workspace = true
tokio.workspace = true
slint.workspace = true
webbrowser = "1"

# Title bar styling on macOS (see `main.rs`).
[target.'cfg(target_os = "macos")'.dependencies]
slint = { workspace = true, features = ["unstable-winit-030"] }

[build-dependencies]
slint-build.workspace = true

[lints]
workspace = true

# `cargo deb -p skills-app` builds target/debian/skillsmate_<version>_<arch>.deb
[package.metadata.deb]
name = "skillsmate"
maintainer = "HomieLab.com <https://github.com/homielab/skillsmate/issues>"
copyright = "2026, HomieLab.com"
section = "devel"
priority = "optional"
extended-description = """\
A fast, native desktop app for the skills.sh ecosystem. Browse and search \
skills, see what is installed for each coding agent (Claude Code, Codex, \
Cursor and many more), and manage skills without the terminal."""
# Winit loads the windowing libraries at runtime instead of linking them, so
# dpkg-shlibdeps ($auto) cannot see them; list them explicitly.
depends = "$auto, libxkbcommon0, libxkbcommon-x11-0, libx11-6, libx11-xcb1, libxcursor1, libxi6"
recommends = "libegl1, libwayland-client0, libwayland-cursor0, xdg-utils"
assets = [
    ["target/release/skillsmate", "usr/bin/", "755"],
    ["../../packaging/linux/skillsmate.desktop", "usr/share/applications/", "644"],
    ["../../packaging/icons/skillsmate.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../packaging/icons/skillsmate-glyph.svg", "usr/share/icons/hicolor/symbolic/apps/skillsmate-symbolic.svg", "644"],
    ["../../packaging/icons/skillsmate-16.png", "usr/share/icons/hicolor/16x16/apps/skillsmate.png", "644"],
    ["../../packaging/icons/skillsmate-32.png", "usr/share/icons/hicolor/32x32/apps/skillsmate.png", "644"],
    ["../../packaging/icons/skillsmate-48.png", "usr/share/icons/hicolor/48x48/apps/skillsmate.png", "644"],
    ["../../packaging/icons/skillsmate-64.png", "usr/share/icons/hicolor/64x64/apps/skillsmate.png", "644"],
    ["../../packaging/icons/skillsmate-128.png", "usr/share/icons/hicolor/128x128/apps/skillsmate.png", "644"],
    ["../../packaging/icons/skillsmate-256.png", "usr/share/icons/hicolor/256x256/apps/skillsmate.png", "644"],
    ["../../packaging/icons/skillsmate-512.png", "usr/share/icons/hicolor/512x512/apps/skillsmate.png", "644"],
]
